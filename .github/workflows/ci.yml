name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci-avrea:
    name: CI (Avrea)
    runs-on: avrea-ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Avrea runners set NODE_OPTIONS=--use-openssl-ca, which Node worker
          # threads reject (ERR_WORKER_INVALID_EXEC_ARGV). Clear it for Next.js.
          NODE_OPTIONS: ""

  ci-github:
    name: CI (GitHub)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
